<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Claude × DeepSeek Debate</title><style>body{font:15px system-ui;background:#0b1020;color:#eee;max-width:900px;margin:auto;padding:16px}section{background:#121a2d;border:1px solid #2a3852;border-radius:14px;padding:14px;margin:12px 0}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 12px;background:#080d18;color:#fff;border:1px solid #33415e;border-radius:9px}button{width:100%;padding:13px;border:0;border-radius:9px;font-weight:700}pre{white-space:pre-wrap;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><h2>Claude × DeepSeek Debate</h2><p>Claude Opus + DeepSeek V4 Pro: bağımsız analiz → karşılıklı eleştiri → Claude nihai sentez.</p><section><div class="grid"><label>Claude API Key<input id="ck" type="password" autocomplete="off"></label><label>DeepSeek API Key<input id="dk" type="password" autocomplete="off"></label></div><label>Soru / görev<textarea id="q" rows="6" placeholder="Sorunu yaz..."></textarea><button id="go">ÇALIŞTIR</button></section><div id="s">Hazır.</div><div id="o"></div><script>const $=x=>document.getElementById(x),out=(t,x)=>{let e=document.createElement('section');e.innerHTML='<b>'+t+'</b><pre></pre>';e.querySelector('pre').textContent=x;$('o').append(e)};async function C(m){let r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':$('ck').value.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-opus-4-6',max_tokens:12000,system:'Act as the primary senior technical agent. Reason rigorously. Do not expose chain-of-thought; give conclusions, evidence, risks and actionable steps.',messages:m})}),j=await r.json();if(!r.ok)throw Error('Claude: '+(j.error?.message||r.status));return j.content?.filter(x=>x.type==='text').map(x=>x.text).join('\n')||''}async function D(m){let r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+$('dk').value.trim()},body:JSON.stringify({model:'deepseek-v4-pro',messages:m,reasoning_effort:'max',thinking:{type:'enabled'},max_tokens:12000})}),j=await r.json();if(!r.ok)throw Error('DeepSeek: '+(j.error?.message||r.status));return j.choices?.[0]?.message?.content||''}async function run(){let q=$('q').value.trim();if(!$('ck').value.trim()||!$('dk').value.trim()||!q)return alert('İki API key ve soru gerekli.');$('go').disabled=true;$('o').innerHTML='';try{$('s').textContent='1/3 Bağımsız analiz...';let[c,d]=await Promise.all([C([{role:'user',content:q}]),D([{role:'user',content:q}])]);out('Claude — bağımsız',c);out('DeepSeek V4 Pro — bağımsız',d);$('s').textContent='2/3 Karşılıklı eleştiri...';let[c2,d2]=await Promise.all([C([{role:'user',content:`Görev: ${q}\n\nClaude: ${c}\n\nDeepSeek: ${d}\n\nDeepSeek yaklaşımını eleştir; hataları ve güçlü yanları belirt.`}]),D([{role:'user',content:`Görev: ${q}\n\nClaude: ${c}\n\nDeepSeek: ${d}\n\nClaude yaklaşımını eleştir; hataları ve güçlü yanları belirt.`}])]);out('Claude — DeepSeek eleştirisi',c2);out('DeepSeek — Claude eleştirisi',d2);$('s').textContent='3/3 Claude nihai hakem...';let f=await C([{role:'user',content:`Görev: ${q}\nClaude ilk: ${c}\nDeepSeek ilk: ${d}\nClaude eleştiri: ${c2}\nDeepSeek eleştiri: ${d2}\n\nİki tarafı değerlendir ve en iyi uygulanabilir nihai cevabı üret. Chain-of-thought verme.`}]);out('NİHAİ SONUÇ — Claude',f);$('s').textContent='Tamamlandı.'}catch(e){out('Hata',e.message);$('s').textContent='Hata.'}finally{$('go').disabled=false}}$('go').onclick=run</script></body></html>
