  - id: EMSAL-14
    kaynak_konum: "claude_api_client.py:281"
    kaynak_alinti: "Command injection vulnerabilities in shell scripts are generally not exploitable in practice since shell scripts generally do not run with untrusted user input. Only report command injection vulnerabilities in shell scripts if they are concrete and have a very specific attack path."
    kural: "'Kullanıcı motoru kandırır' iddiası somut bir yol göstermedikçe geçersizdir."
    gerekce: >-
      Kaynağın mantığı: girdi güvenilir akıştan geliyorsa iddia somut bir
      saldırı yolu gerektirir. Karşılığı: motorlara giden job dosyaları
      serbest metinden değil, doğrulanmış paketten üretilir.
    bu_depodaki_karsiligi: >-
      "Kullanıcı metniyle motor kandırılabilir" iddiası somut yol
      göstermedikçe elenir: paket alımı SHA defteri + gerileme korkuluğundan
      geçer (CLAUDE.md veri alımı kuralı).
    katman: 3
    desen_ailesi: null
    uygulanamaz: false
    kontrol:
      desen: '(kullanıcı|kullanici)[^.]{0,50}(motoru|job|iş dosyası|boru hattını)[^.]{0,30}(kandır|zorla|enjekte|yanılt)'
      istisna_desen: '(sha|paket|gerileme|somut yol)'
      kosul: null
      eleme_gerekcesi: "Somut yol gösterilmemiş 'motor kandırılır' iddiası (paket alımı SHA + gerileme korkuluğundan geçiyor)"

  - id: EMSAL-15
    kaynak_konum: "claude_api_client.py:282"
    kaynak_alinti: "SSRF (Server-Side Request Forgery) vulnerabilities in client-side JavaScript/TypeScript files (.js, .ts, .tsx, .jsx) are not valid since client-side code cannot make server-side requests that would bypass firewalls or access internal resources. Only report SSRF in server-side code (e.g. Python or JS that is known to run on the server-side). The same logic applies to path-traversal attacks, they are not a problem in client-side JS."
    kural: "Bir iddia yalnız onu ÜRETEBİLEN yüzeyden geçerlidir (SERT-10 ile aynı kapı, kaynakta da tekrar)."
    gerekce: >-
      Kaynak aynı mantığı ikinci kez, dosya-tipi kapısı olarak kurar
      (findings_filter.py:145-152 HTML kapısı). Burada karşılığı motor
      ailesidir: türev iddiası yalnız türev ailesinden geçerlidir.
    bu_depodaki_karsiligi: >-
      Bkz. SERT-10 (2. katman aile kapısı) + kapsam kapısı: turev-akis kaynaklı
      olsa bile kapsam < 0.5 ise iddia doğrulanmamıştır (turev_akis.py
      kapsam_esigi, fail-closed).
    katman: 2
    desen_ailesi: "_TUREV_DESENLERI"
    uygulanamaz: false
    kontrol: null

