    kaynak_alinti: "React is generally secure against XSS. React does not need to sanitize or escape user input unless it is using dangerouslySetInnerHTML or similar methods. Do not report XSS vulnerabilities in React components or tsx files unless they are using unsafe methods."
    kural: "Motor çıktısı yapı gereği kaynaklıdır; 'uydurma seviye' itirazı yalnız ELLE kurulan seviyeye yöneltilebilir."
