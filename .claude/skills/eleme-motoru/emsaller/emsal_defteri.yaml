    kaynak_alinti: "A lack of permission checking or authentication in client-side TS code is not a vulnerability. Client-side code is not trusted and does not need to implement these checks, they are handled on the server-side. The same applies to all flows that send untrusted data to the backend, the backend is responsible for validating and sanitizing all inputs."
    kural: "Sunum katmanının kapı uygulamaması bulgu değildir; kapılar karar katmanındadır."
    gerekce: >-
      Kaynağın mantığı: kontrol, güvenilen katmanın (sunucu) sorumluluğudur;
      istemcide yokluğu bulgu değildir. Karşılığı: çizim/metin sunumu kapı
      uygulamaz; kapılar sentez.py + motor kapılarındadır.
    bu_depodaki_karsiligi: >-
      "Grafik/SVG çıktısı R kapısını uygulamıyor" bir bulgu değildir —
      CLAUDE.md: "Grafik bir KARAR DEĞİLDİR; yön/işlem hükmü piramit-sistem/
      karar-kurulu sentezinden gelir."
    katman: 3
    desen_ailesi: null
    uygulanamaz: false
    kontrol:
      desen: '(grafik|çizim|svg|rapor metni|sunum)[^.]{0,60}(kapı|kapi|doğrulama|dogrulama|kontrol)[^.]{0,20}(yok|uygulanmıyor|uygulamıyor|eksik)'
      istisna_desen: null
      kosul: null
      eleme_gerekcesi: "Sunum katmanının kapı uygulamaması bulgu değil (kapılar sentez/motor katmanında)"

