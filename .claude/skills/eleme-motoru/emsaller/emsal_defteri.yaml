    kaynak_konum: "claude_api_client.py:283"
    kaynak_alinti: "Path traversal attacks using ../ are generally not a problem when triggering HTTP requests. These are generally only relevant when reading files where the ../ may allow accessing unintended files."
    kural: "(Bu alana taşınamaz.)"
    gerekce: >-
      Emsal tamamen dosya yolu semantiğine dayanır (../ ile istenmeyen dosyaya
      erişim). Piyasa iddiası alanında bir karşılığı yoktur; zorlama bir
      analoji uydurma kural olurdu (CLAUDE.md sert yasak 1).
    bu_depodaki_karsiligi: "YOK — dosya yolu semantiğinin piyasa karşılığı yok."
    katman: 0
    desen_ailesi: null
    uygulanamaz: true
    kontrol: null

  - id: EMSAL-17
    kaynak_konum: "claude_api_client.py:284"
    kaynak_alinti: "Injecting into log queries is generally not an issue. Only report this if the injection will definitely lead to exposing sensitive data to external users."
    kural: "Kullanıcı metninin rapora karışması bulgu değildir; KESİN sonuç doğuruyorsa bulgudur."
    gerekce: >-
      Kaynak, sonucu kesin olmayan enjeksiyonu eler ("only report ... if it
      will definitely lead to"). Karşılığı: kullanıcı anlatısının rapor
      metnine sızması, KESİN bir kaynaksız sayı doğurmadıkça bulgu değildir.
    bu_depodaki_karsiligi: >-
      "Kullanıcının cümlesi rapora karıştı" elenir; o cümle rapor metnine
      KAYNAKSIZ BİR SAYI soktuysa elenmez — iddia_denetle.py bunu birebir
      denetler (metindeki her sayı koşu raporunda var mı).
    katman: 3
    desen_ailesi: null
    uygulanamaz: false
    kontrol:
      desen: '(kullanıcı|kullanici)[^.]{0,50}(metni|cümlesi|anlatısı|yorumu)[^.]{0,30}(rapora|çıktıya|metne)[^.]{0,20}(karış|sız|geç)'
      istisna_desen: 'kaynaksız sayı|kaynaksız değer|iddia_denetle'
      kosul: null
      eleme_gerekcesi: "Kullanıcı anlatısının rapora karışması bulgu değil (bulgu: kesin kaynaksız sayı → iddia_denetle)"
