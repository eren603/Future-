      tehlikeli yolu kullanmasıdır. Karşılığı: seviyeler smc_tespit /
      emir_plani'nden ölçülerek gelir (yuvarlak/uydurma seviye yasak,
      CLAUDE.md emir çıktısı kuralı); tehlikeli yol = elle kurulan seviye.
    bu_depodaki_karsiligi: >-
      Motor kaynaklı seviyeye "uydurma" itirazı elenir; ELLE kurulan
      stop/hedef için itiraz GEÇERLİDİR ve rr_denetim.py'den geçmelidir
      (şişirilmiş R yasağı).
    katman: 3
    desen_ailesi: null
